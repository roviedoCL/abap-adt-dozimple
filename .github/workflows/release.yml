name: Release

# Publica en npm con procedencia (trusted publishing, OIDC: sin tokens guardados) y crea la release firmada de
# GitHub. Solo al crear un tag vX.Y.Z; la publicación espera la aprobación manual del environment «release».
on:
  push:
    tags: ["v*"]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # firma de la atestación de procedencia (Sigstore)
      attestations: write
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: El tag coincide con la versión de package.json
        id: version
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "El tag $GITHUB_REF_NAME no coincide con package.json ($v)"; exit 1; }
          case "$v" in *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT";; *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT";; esac
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit signatures
      - run: node scripts/scan-sensitive.mjs
      - name: Empaquetar
        id: pack
        run: |
          npm pack --ignore-scripts
          echo "tarball=$(ls dozimple-abap-adt-*.tgz)" >> "$GITHUB_OUTPUT"
      - run: npm sbom --omit=dev --sbom-format=cyclonedx --sbom-type=application > sbom.cdx.json
      - name: Atestación de procedencia del paquete
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}
      - run: cp "${{ steps.attest.outputs.bundle-path }}" "${{ steps.pack.outputs.tarball }}.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.tarball }}.sigstore.json
            sbom.cdx.json
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release # aprobación manual; solo tags v*
    permissions:
      contents: write # crear la release de GitHub
      id-token: write # trusted publishing en npm (OIDC) y procedencia
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm con trusted publishing (>= 11.5.1)
        run: npm install -g npm@11.19.1 --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - name: Publicar en npm con procedencia
        run: npm publish "${{ needs.build.outputs.tarball }}" --provenance --access public --tag "${{ needs.build.outputs.dist_tag }}"
      - name: Comprobar etiquetas de npm
        run: |
          v="${GITHUB_REF_NAME#v}"
          tag="$(npm view @dozimple/abap-adt dist-tags.${{ needs.build.outputs.dist_tag }})"
          [ "$tag" = "$v" ] || { echo "dist-tag ${{ needs.build.outputs.dist_tag }} = $tag, se esperaba $v"; exit 1; }
          npm view @dozimple/abap-adt dist-tags
      - name: Release de GitHub con paquete, atestación y SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; [ "${{ needs.build.outputs.dist_tag }}" = next ] && pre="--prerelease"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $pre \
            "${{ needs.build.outputs.tarball }}" "${{ needs.build.outputs.tarball }}.sigstore.json" sbom.cdx.json
